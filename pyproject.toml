[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masked-longtext"
version = "0.1.0"
description = "Portable prefix-block masked latent language modeling"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24"]

[project.optional-dependencies]
text = ["transformers>=4.40,<5", "tokenizers>=0.19"]
test = ["pytest>=8"]

[project.scripts]
masked-longtext = "masked_longtext.__main__:main"

[tool.setuptools.packages.find]
include = ["masked_longtext*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
